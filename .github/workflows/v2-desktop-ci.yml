name: V2 desktop CI
on:
  push:
    branches: ['develop/v2-tauri']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify JavaScript suites
        shell: pwsh
        run: |
          node --test (Get-ChildItem tests -File | Where-Object { $_.Extension -in '.js', '.cjs' } | ForEach-Object FullName)
      - name: Verify the offline launcher
        shell: pwsh
        run: ./tests/test_windows_batch_path.ps1
      - run: cargo test --manifest-path src-tauri/routeros/Cargo.toml
      - run: node scripts/prepare-desktop.cjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npx --yes --package @tauri-apps/cli@2 tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: mikrotik-studio-alpha-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  chr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated CHR lab
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86
          curl --fail --location --retry 3 https://download.mikrotik.com/routeros/7.21.5/chr-7.21.5.img.zip -o /tmp/chr.zip
          echo 'dbb8f1739da73a68e5167fcbc731a5ba3d50f9d9b195731b96f96fcc58904580  /tmp/chr.zip' | sha256sum --check
          unzip -q /tmp/chr.zip -d /tmp
      - run: python3 -u tests/chr/smoke.py /tmp/chr-7.21.5.img
  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: bash tests/api_tls.sh
      - run: pip install 'playwright>=1.56,<2'
      - run: node scripts/prepare-desktop.cjs
      - run: python tests/desktop_ui.py --chromium "$(command -v google-chrome)"
