name: V2 desktop CI
on:
  push:
    branches: ['develop/v2-tauri']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify JavaScript suites
        shell: pwsh
        run: |
          node --test (Get-ChildItem tests -File | Where-Object { $_.Extension -in '.js', '.cjs' } | ForEach-Object FullName)
      - name: Verify the offline launcher
        shell: pwsh
        run: ./tests/test_windows_batch_path.ps1
      - run: cargo test --manifest-path src-tauri/routeros/Cargo.toml
      - run: node scripts/prepare-desktop.cjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npx --yes --package @tauri-apps/cli@2 tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: mikrotik-studio-alpha-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  chr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        id: chr-cache
        with:
          path: ${{ runner.temp }}/studio-chr-7.21.5.zip
          key: studio-chr-7.21.5-dbb8f1739da73a68
      - name: Prepare isolated CHR lab
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86
          zip_path="$RUNNER_TEMP/studio-chr-7.21.5.zip"
          checksum="dbb8f1739da73a68e5167fcbc731a5ba3d50f9d9b195731b96f96fcc58904580  $zip_path"
          if ! sha256sum --status --check <<< "$checksum"; then
            rm -f "$zip_path"
            for attempt in 1 2 3 4; do
              if curl --http1.1 --fail --silent --show-error --location --continue-at - --connect-timeout 20 --max-time 225 https://download.mikrotik.com/routeros/7.21.5/chr-7.21.5.img.zip -o "$zip_path"; then
                break
              fi
            done
          fi
          sha256sum --check <<< "$checksum"
          unzip -q "$zip_path" -d "$RUNNER_TEMP"
      - uses: actions/cache/save@v4
        if: steps.chr-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/studio-chr-7.21.5.zip
          key: studio-chr-7.21.5-dbb8f1739da73a68
      - run: python3 -u tests/chr/smoke.py "$RUNNER_TEMP/chr-7.21.5.img"
  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: bash tests/api_tls.sh
      - run: pip install 'playwright>=1.56,<2'
      - run: node scripts/prepare-desktop.cjs
      - run: python tests/desktop_ui.py --chromium "$(command -v google-chrome)"
