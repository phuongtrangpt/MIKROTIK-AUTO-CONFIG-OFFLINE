name: Publish Windows Offline Release

on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (example: v1.4.1)'
        required: true
        default: 'v1.4.1'

permissions:
  contents: write

jobs:
  windows-updater-path-test:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Test Windows BAT launch in folder with spaces and parentheses
        shell: pwsh
        run: .\\tests\\test_windows_batch_path.ps1
      - name: Verify updater and JS tests
        shell: pwsh
        run: |
          node tests/test_updater_path.js
          node tests/test_update.js
          node tests/test_update_ui.js
  publish:
    needs: windows-updater-path-test
    name: Build offline ZIP and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select and verify version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="${REQUESTED_VERSION:-v1.4.1}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          APP_VERSION="${VERSION#v}"
          if ! grep -Fq "const VERSION = '$APP_VERSION';" core.js; then
            echo "core.js does not match release version $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ZIP (offline, no installation required)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/MikroTik_Auto_Config_Studio
          cp index.html app.js core.js update.js style.css README.md README.txt CHANGELOG.txt CHAY_PHAN_MEM.bat CAP_NHAT_TU_DONG.bat CAP_NHAT_TU_DONG.ps1 dist/MikroTik_Auto_Config_Studio/
          cp -r tests dist/MikroTik_Auto_Config_Studio/
          (
            cd dist
            zip -q -r "MikroTik_Auto_Config_Studio_${{ steps.release.outputs.version }}_Windows_Offline.zip" MikroTik_Auto_Config_Studio
          )
          unzip -t "dist/MikroTik_Auto_Config_Studio_${{ steps.release.outputs.version }}_Windows_Offline.zip"

      - name: Publish Release and attach installer ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="dist/MikroTik_Auto_Config_Studio_${VERSION}_Windows_Offline.zip"
          cat > release-notes.md <<'NOTES'
          ### MikroTik Auto Config Studio — Windows Offline

          Trình hướng dẫn cấu hình MikroTik RouterOS 7 từng bước: chọn thiết bị, WAN, LAN, VLAN, PPPoE Server, PCC, PCQ và xuất script cho Winbox.

          - PPPoE WAN trực tiếp hoặc qua VLAN 802.1Q, yêu cầu xác nhận với nhà mạng.
          - Nhập băng thông từng WAN, tự tính tỷ lệ PCC (ví dụ 250M + 1G = 1:4).
          - Chọn cổng Bridge LAN thủ công; PPPoE Server trên Bridge LAN, Bridge riêng hoặc VLAN.
          - Giao diện tiếng Việt, hoạt động offline trên Windows, không cần cài Node.js.
          - v1.4.1: sửa lỗi cập nhật trong thư mục Windows có dấu cách và ngoặc (New folder (29)); dùng $PSScriptRoot và bổ sung kiểm thử trên Windows.
          - Liên hệ hỗ trợ: Việt Phương — 0963839369 — https://www.facebook.com/leviethoaiphuong/

          **Cách sử dụng:** Tải file ZIP trong Assets, giải nén, chạy `CHAY_PHAN_MEM.bat` hoặc mở `index.html`.

          **Cập nhật lần sau:** Nhấn Kiểm tra cập nhật trong giao diện để tự tải ZIP, hoặc chạy `CAP_NHAT_TU_DONG.bat` để tự cập nhật ứng dụng trên Windows.\n\n          **An toàn:** Chỉ dùng với RouterOS 7 No Default Configuration; cần thử trên router dự phòng trước khi triển khai. Script xuất ra có thể chứa mật khẩu PPPoE.
          NOTES
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ASSET" --clobber
          else
            gh release create "$VERSION" "$ASSET" --target "$GITHUB_SHA" --title "MikroTik Auto Config Studio $VERSION — Windows Offline" --notes-file release-notes.md --latest
          fi
